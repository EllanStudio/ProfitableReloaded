name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitablereloaded-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Maven verify (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          print(root.find("m:version", namespace).text)
          PY
          )"

          if [[ -z "$version" ]]; then
            echo "Could not read the project version from pom.xml" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Project version $version must use the numeric major.minor.patch format" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag $GITHUB_REF_NAME must use the vMAJOR.MINOR.PATCH format" >&2
              exit 1
            fi

            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match pom.xml version $version" >&2
              exit 1
            fi

            head_commit="$(git rev-parse HEAD)"
            main_commit="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$head_commit" != "$main_commit" ]]; then
              echo "Release tags must point to the current origin/main commit" >&2
              echo "tag commit:  $head_commit" >&2
              echo "main commit: $main_commit" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=target/profitablereloaded-$version.jar" >> "$GITHUB_OUTPUT"
          echo "checksum=target/profitablereloaded-$version.jar.sha256" >> "$GITHUB_OUTPUT"

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged plugin metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          JAR_PATH: ${{ steps.metadata.outputs.jar }}
        run: |
          test -f "$JAR_PATH"

          plugin_version="$(unzip -p "$JAR_PATH" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | tr -d '\r')"
          if [[ "$plugin_version" != "$EXPECTED_VERSION" ]]; then
            echo "plugin.yml version $plugin_version does not match pom.xml version $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Generate SHA-256 checksum
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          cd target
          sha256sum "profitablereloaded-$VERSION.jar" \
            > "profitablereloaded-$VERSION.jar.sha256"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profitablereloaded-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.jar }}
            ${{ steps.metadata.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profitablereloaded-${{ needs.build.outputs.version }}
          path: release

      - name: Verify downloaded checksum
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          sha256sum --check "profitablereloaded-$VERSION.jar.sha256"

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="ProfitableReloaded $tag"
          jar_name="profitablereloaded-$VERSION.jar"
          checksum_name="$jar_name.sha256"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir existing-release \
              --pattern "$jar_name" \
              --pattern "$checksum_name"
            (
              cd existing-release
              sha256sum --check "$checksum_name"
            )
            released_plugin_version="$(unzip -p "existing-release/$jar_name" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | tr -d '\r')"
            if [[ "$released_plugin_version" != "$VERSION" ]]; then
              echo "Existing release contains plugin version $released_plugin_version, expected $VERSION" >&2
              exit 1
            fi
            echo "Release $tag already contains complete checksum-verified assets; leaving it unchanged."
          else
            gh release create "$tag" \
              "release/$jar_name" \
              "release/$checksum_name" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "ProfitableReloaded uses an independent version line from legacy Profitable releases." \
              --title "$title"
          fi
