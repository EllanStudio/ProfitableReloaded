# Lang file to be used by the plugin. Available: en, zh_cn, zh_TW, es (missing keys fall back to English)
language: zh_cn

# Optional update checker. Disabled until this fork has a published Modrinth project.
update-check:
  enabled: false
  modrinth-project: ""
  download-url: "https://github.com/EllanServer/ProfitableReloaded/releases"

# Allows Vault currency be added as an asset, withdrawn or deposited to your account
vault-support: true

# Allows PlayerPoints currency be added as an asset, withdrawn or deposited to your account
player-points-support: true

colors: # Allows customization of command outputs and graphs
  # Color for prices going up (hex)
  bullish: "#8CD740"

  # Color for prices going down (hex)
  bearish: "#FA413B"

database:
  # orders are able to transact across worlds if false
  data-per-world: false

  # (0)-SQLite (1)-mySQL
  database-type: 0

  pool:
    # MySQL connections available to concurrent command and GUI queries
    maximum-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000

  mysql:
    host:
    port:
    database:
    username:
    password:
    options: "?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"

# Redis configuration for Velocity proxy / multi-server support
# Shared MySQL remains authoritative for orders, balances and candles. Redis carries
# account-session coordination, asset-cache invalidation and notification events.
# NOTE: SQLite is a single-file database not suitable for multi-server use.
#       Switch database-type to 1 (MySQL) when running behind a Velocity proxy.
redis:
  # Enables the cross-backend coordination and notification bus.
  # Redis does not replicate balances, orders, executions or candles.
  enabled: false
  # When enabled and required, startup fails if Redis is unavailable. A later
  # disconnect blocks new trades until coordination recovers; cancellation and
  # durable outbox recovery remain available.
  required: true
  # Must be unique and stable for every backend behind Velocity. An active duplicate
  # is rejected through a Redis lease instead of silently dropping peer events.
  server-id: "server-1"
  host: localhost
  port: 6379
  # Leave blank if your Redis instance has no password
  password:
  # Prefix prepended to all channel names used by this plugin
  channel-prefix: "profitable"
  # Maximum number of reconnection attempts before giving up
  reconnect-attempts: 5
  # Base delay for exponential reconnection backoff with jitter, in milliseconds
  reconnect-delay-ms: 2000

exchange:
  fees: # Fixed: 23    Percentage: 23%
    # Wallet command amounts are gross: the configured fee is deducted from this
    # amount, and the destination receives gross minus fee.
    # Fees when you take money from your wallet
    withdrawal-fees: 0
    # Fees when you add money to your wallet
    deposit-fees: 0

  commodities:
    fees: # Fixed: 23    Percentage: 23%
      # Fees when you transact immediately with another order
      taker-fees: 0
      # Fees when you add an order to the order book
      maker-fees: 0

      # Fees when you use the claiming tag on an entity (fixed only)
      entity-claiming-fees: 0

    # note: commodities are RAW and FUNGIBLE materials traded in BULK that are then processed into different products
    #       crops and building material can be commodities as well:
    #
    #       IRON IS a commodity (in real life)
    #             -All bars are the same quality, therefore interchangeable (Fungible) v
    #             -Traded in large amounts (Traded in Bulk) v
    #             -Usually gathered from the ground (raw material) v
    #
    #       DIAMOND HELMET is NOT a commodity
    #             -Enchantments, damage, and trims make each one unique (Non-Fungible) x
    #             -Usually traded one at a time (not in bulk) x
    #             -Finished product (not raw) x
    #
    #     but this is only a recommendation anyway, use this plugin however you want.
    #
    generation:
      # Allows auto-generation of assets for commodities in each world using whitelisting/blacklisting
      active: true

      # Enables whitelist and disables blacklist for items
      item-whitelisting: true
      commodity-item-whitelist:
